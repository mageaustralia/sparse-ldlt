[package]
name = "sparse-ldlt"
version = "0.3.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
authors = ["Matthew Campbell <mcampbell@mageaustralia.com.au>"]
description = "Pure-Rust, dependency-free sparse symmetric-indefinite LDLᵀ factorization with signed pivots (matrix inertia) and solve."
readme = "README.md"
homepage = "https://mageengineering.com.au/"
repository = "https://github.com/mageaustralia/sparse-ldlt"
keywords = ["sparse", "ldlt", "factorization", "indefinite", "inertia"]
categories = ["mathematics", "science"]

[dependencies]

[dev-dependencies]
criterion = "0.5"

[features]
# CI-only: fetch real SuiteSparse/MatrixMarket SPD matrices and validate the factorization
# against them (see tests/corpus.rs). Requires network at test time; never compiled by
# default, so `cargo build` and `cargo publish` stay dependency-free.
corpus-tests = []

[[bench]]
name = "factor_solve"
harness = false
